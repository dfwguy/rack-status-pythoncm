[package]
name = "nvrs"
description = "NVIDIA Rack Status CLI — run tests, validations and reports against a Rack Status deployment from the terminal."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "nvrs"
path = "src/main.rs"

[dependencies]
nvrs-client = { path = "../nvrs-client" }
nvrs-auth = { path = "../nvrs-auth" }
nvrs-openapi = { path = "../nvrs-openapi" }
serde.workspace = true
serde_json.workspace = true
url.workspace = true
tokio = { workspace = true, features = ["signal"] }
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
anyhow = "1"
toml = "0.8"
comfy-table = "7"
serde_yaml = "0.9"
# Hidden password prompt for `nvrs login`.
rpassword = "7"
# Interactive terminal: raw TTY mode + size, and the sink/stream combinators for the WebSocket.
crossterm = "0.28"
futures-util.workspace = true

[dev-dependencies]
tempfile = "3"
