worker_processes 1;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  access_log /dev/stdout;
  error_log /dev/stderr warn;
  sendfile on;
  aio threads;
  directio 8m;

  server {
    listen 10.41.112.3:12130;
    server_name _;
    allow 10.41.112.3;
    allow 127.0.0.1;
    deny all;

    location = /healthz {
      default_type text/plain;
      return 200 "OK\n";
    }

    # Bootstrap the small, signed NVIS-P2P client update through Dragonfly's
    # regular-task path. Compute peers verify the SHA-256 digest and request
    # with back-to-source disabled; this exception also permits the initial
    # HEAD request that Dragonfly uses to calculate task metadata.
    location = /.nvis-p2p/nvis-p2p-client-v1.4.9-arm64-64k-units.tar.gz {
      root /srv/images;
      allow 10.41.0.0/16;
      allow 10.41.112.3;
      allow 127.0.0.1;
      deny all;
      limit_except GET HEAD { deny all; }
    }

    location / {
      root /srv/images;
      limit_except GET HEAD { deny all; }
    }
  }
}
