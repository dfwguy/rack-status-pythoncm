name: nvis-p2p-object-store

services:
  minio:
    image: quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: nvis-p2p-object-store
    user: "1024:1003"
    entrypoint:
      - /bin/sh
      - -ec
      - |
        IFS= read -r MINIO_ROOT_PASSWORD < /run/secrets/root_password
        export MINIO_ROOT_PASSWORD
        exec minio server /data --certs-dir /certs --address :9000 --console-address :9001
    environment:
      MINIO_ROOT_USER: nvis-p2p-dfstore
      MINIO_BROWSER_REDIRECT_URL: https://127.0.0.1:19001
    secrets:
      - root_password
    volumes:
      - /cluster/OVA/NVIS-P2P/object-store/data:/data
      - ./certs:/certs:ro
    ports:
      - "10.41.112.3:19000:9000"
      - "127.0.0.1:19001:9001"
    restart: unless-stopped
    pids_limit: 512
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-fk", "https://127.0.0.1:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

secrets:
  root_password:
    file: ./secrets/root_password
