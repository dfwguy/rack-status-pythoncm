name: nvis-p2p-object-store

services:
  minio:
    image: quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: nvis-p2p-object-store
    user: "1024:1003"
    entrypoint:
      - /bin/sh
      - -ec
      - |
        IFS= read -r MINIO_ROOT_PASSWORD < /run/secrets/root_password
        export MINIO_ROOT_PASSWORD
        exec minio server /data --certs-dir /certs --address :9000 --console-address :9001
    environment:
      MINIO_ROOT_USER: nvis-p2p-dfstore
      MINIO_BROWSER_REDIRECT_URL: https://127.0.0.1:19001
    secrets:
      - root_password
    volumes:
      - /cluster/OVA/NVIS-P2P/object-store/data:/data
      - ./certs:/certs:ro
    ports:
      - "10.41.112.3:19000:9000"
      - "127.0.0.1:19001:9001"
    restart: unless-stopped
    pids_limit: 512
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # Probe /minio/health/live with whatever the image has, over the scheme the site serves (HTTPS
    # only when render-site-config placed certs). A bare curl probe assumed both: Nscale NC runs a
    # locally built image with no curl and serves plain HTTP, so it failed forever and
    # fleet-snapshot.py reported the store down. Without curl, fall back to openssl s_client for
    # TLS or bash's /dev/tcp for HTTP; a TLS site with neither can only prove the port listens.
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - |
          scheme=http; [ -s /certs/public.crt ] && scheme=https
          if command -v curl >/dev/null; then
            exec curl -fsk -m 4 -o /dev/null "$$scheme://127.0.0.1:9000/minio/health/live"
          fi
          req=$$'GET /minio/health/live HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n'
          if [ "$$scheme" = https ] && command -v openssl >/dev/null; then
            status=$$(printf '%s' "$$req" | timeout 4 openssl s_client -quiet -connect 127.0.0.1:9000 2>/dev/null | head -n1)
          else
            exec 3<>/dev/tcp/127.0.0.1/9000 || exit 1
            [ "$$scheme" = https ] && exit 0
            printf '%s' "$$req" >&3
            IFS= read -r -t 4 status <&3
          fi
          [[ $$status == *" 200 "* ]]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

secrets:
  root_password:
    file: ./secrets/root_password
