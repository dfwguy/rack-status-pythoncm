# NVIS-P2P pinned binary artifacts.
#
# These are the Dragonfly binaries the P2P control plane and compute peers run. They are NOT
# committed to git (~300 MB); they are staged into deploy/p2p/dist/ and checksum-verified at image
# build time by deploy/p2p/bin/stage-artifacts.sh, so the image is self-contained for an air-gapped
# deploy while the repository stays lean. This file is the reproducibility anchor: the exact bytes a
# build is allowed to bake in.
#
#   Dragonfly core   v2.5.1  (commit 5523218a3710b2d5bc8fbdb0b1473d3a4d64916d)  -> manager, scheduler
#   Dragonfly client v1.4.9                                                     -> dfdaemon, dfget, dfstore
#
# Two client builds:
#   client-amd64-v1.4.9      official upstream release (x86-64 seeds / origin / control plane)
#   client-arm64-64k-v1.4.9  CUSTOM build for aarch64 GB300 compute with a 64 KiB page size
#                            (built via deploy/p2p/scripts/build-dragonfly-client.sh; no upstream
#                             release carries the 64 KiB ELF alignment, so it is provisioned from a
#                             staged artifact set, never fetched).
#
# Verify a staged tree:   cd deploy/p2p/dist && sha256sum -c ../artifacts.lock
#
# Format is sha256sum(1) -c compatible: "<sha256>  <path-relative-to-dist/>".
