worker_processes 4;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
    multi_accept off;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 15s;

    server {
        listen 8089;
        server_name seed-fast-origin;

        location = /healthz {
            default_type text/plain;
            return 200 "ok\n";
        }

        # This container is bound only to the appserver's local service IP and
        # exists solely to preheat the high-bandwidth Dragonfly seed.
        location /nvftp-20260824/ {
            alias /srv/nvftp-20260824/;
            autoindex off;
        }
    }
}
