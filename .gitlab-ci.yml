include:
  - project: 'ci-toolkit/ci-toolkit'
    ref: 'stable'
    file:
      - .reusable_jobs/release/mono/release.yml
      - .reusable_jobs/auto_merge/auto_merge_automated_release.yml
      - .reusable_jobs/docker/multi/buildkit/docker_build_and_push_rc.yml
      - .reusable_jobs/docker/multi/buildkit/docker_build_and_push.yml
  # Must be last: overrides ci-toolkit .pipeline_post_job_hooks (drops Slack failure notifications).
  - local: .gitlab-ci/ci-toolkit-no-slack.yml

default:
  retry:
    max: 2
    when:
      - script_failure
      - runner_system_failure
      - stuck_or_timeout_failure
      - scheduler_failure
      - api_failure
      - data_integrity_failure
      - unknown_failure

# App CI (lint / test / image verify) runs first; ci-toolkit release + JFrog push last.
stages:
  - lint
  - test
  - build
  - ci_toolkit_release

variables:
  # No Slack (MR notifier + pipeline-failure hooks). Re-enable: CI_TOOLKIT_ENABLE_SLACK: "true"
  CI_TOOLKIT_ENABLE_SLACK: "false"
  LOG_LEVEL: "INFO"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm-cache"
  GITLAB_RUNNER_DOCKER_TAG: "fusion-instance-k8s"

  ############# AUTOMATED BADGES ###########################################
  CI_TOOLKIT_AUTOMATED_BADGES: "['apps_release_badges.json']"
  ##########################################################################
  CI_TOOLKIT_MR_COMMENTER_BOT: "CI_TOOLKIT_VERSION_BOT"
  ##########################################################################

  ############# AUTOMATED DOCKER BUILD AND PUSH TO JFROG ################
  PUSH_TO_JFROG: "true"
  JFROG_IMAGE_PREFIX: "artifactory.nvidia.com/it-astra-docker-local"
  JFROG_DOCKER_REGISTRY_HOSTNAME: "artifactory.nvidia.com"
  ##########################################################################

# Run lint/test/build on branch pushes and merge requests
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# ─── Lint ────────────────────────────────────────────────────────────────────

python-lint:
  stage: lint
  image: python:3.12-slim
  cache:
    key: pip-${CI_COMMIT_REF_SLUG}
    paths:
      - .pip-cache/
  script:
    # Pinned on purpose. Unpinned, every ruff release can widen the default rule set under us --
    # which is how this job sat red at ~310 findings for months while allow_failure hid it. Bump
    # the pin deliberately, with the new findings fixed in the same commit.
    #
    # The pin alone was not enough: until ruff.toml existed there was no config in the repo at all,
    # so "which rules" was answered by ruff's built-in defaults rather than by us. ruff.toml now
    # declares it -- full PEP 8 on top of the defaults, with E501 deliberately off.
    # Same pins as backend/requirements-dev.txt -- installed narrowly here because this job needs
    # no runtime dependencies, so keep the two in step when bumping either.
    - pip install -q ruff==0.16.0 pylint==4.0.7
    - ruff check backend/ --exclude tests
    # backend/tests stays excluded FOR NOW, and that is a gap worth naming rather than inheriting:
    # nothing has ever linted the tests, so they carry 99 findings today (26 unsorted imports, 22
    # stale `# noqa` that suppress rules which were never on, 14 subprocess calls without `check=`,
    # 7 unused imports, and ~30 needing a judgement call). 63 are auto-fixable. Closing it is a
    # separate commit -- gating it here today would just turn the job red.
    # Pylint runs only for what ruff structurally cannot see: cross-module duplicate code. Config
    # and the reasoning for every enabled/disabled check live in .pylintrc.
    - pylint --recursive=y backend
    - bash scripts/check_no_vault_in_git.sh

typescript-check:
  stage: lint
  image: node:24-slim
  cache:
    key: npm-${CI_COMMIT_REF_SLUG}
    paths:
      - frontend/node_modules/
      - .npm-cache/
  script:
    - cd frontend
    - npm ci --ignore-scripts
    - npx tsc -b --noEmit
    # Hard gate, no allow_failure: every eslint rule in the config is at zero errors as of
    # 2026-08-04, so any error here is something this commit introduced. Warnings do not fail
    # the job -- set-state-in-effect is deliberately a warning and eslint.config.js says why.
    - npm run lint

# ─── Test ────────────────────────────────────────────────────────────────────

python-test:
  stage: test
  image: python:3.12-slim
  cache:
    key: pip-${CI_COMMIT_REF_SLUG}
    paths:
      - .pip-cache/
  script:
    # requirements-dev.txt pins the test tooling so this job and a contributor's laptop run the
    # same versions. pytest/pytest-cov used to be installed unpinned here, which meant CI tracked
    # latest and a green local run was a different claim from a green pipeline.
    - pip install -q -r backend/requirements.txt -r backend/requirements-dev.txt
    # BEFORE the suite, because it answers a different question and answers it clearly: does the
    # COMMITTED tree import, using only files git tracks? On 2026-08-21 an import was committed one
    # commit before the module it named, and the suite reported it as 34 collection errors whose
    # shared cause was one missing file. This says so in one line, and it needs the deps installed
    # above, which is why it lives here and not in the lint job.
    - bash bin/check-tracked-tree.sh
    # greenlight.toml.example is generated from backend/config_registry.py. A generated file
    # nobody regenerates is worse than a hand-written one, because it claims to be derived from
    # the code -- so this fails the build when a setting was declared without regenerating.
    - python bin/gen-greenlight-example.py --check
    # The action vocabulary is a published document, so a renamed action fails here rather
    # than being discovered by a policy that silently matches nothing.
    - python bin/gen-action-vocabulary.py --check
    # Run from the repo root so backend modules resolve repo-root assets (var/, etc.);
    # pytest adds backend/ to sys.path via the backend/tests package.
    # --cov-config picks up .coveragerc, which measures ALL of backend/ with branch coverage. The
    # previous form named --cov=ai_chat --cov=workflow_engine, so the reported figure described two
    # modules out of 136 and the gate below would have had almost nothing to check.
    - python -m pytest backend/tests/ -v --tb=short --junitxml=report-python.xml --cov --cov-config=.coveragerc --cov-report=term-missing --cov-report=json:coverage.json
    # REQ-45: every file meets the 50% floor, or is on a list of known exceptions that may only
    # shrink. Runs after the suite because it reads the report the suite produced.
    - python bin/check-coverage-floor.py coverage.json
  coverage: '/TOTAL.+\s(\d+%)/'
  artifacts:
    when: always
    paths:
      - coverage.json
    reports:
      junit: report-python.xml

auth-benchmark:
  stage: test
  image: python:3.12-slim
  # RECORDS, NEVER GATES. A runner is a noisy shared machine, so a latency assertion here would
  # fail on unrelated commits — and a perf job that cries wolf is one somebody sets to
  # allow_failure and then stops reading. `bin/bench-auth.py` always exits 0 by design; this
  # `allow_failure` covers the job's own plumbing (deps, artifacts), not the numbers.
  allow_failure: true
  cache:
    key: pip-${CI_COMMIT_REF_SLUG}
    paths:
      - .pip-cache/
  script:
    - pip install -q -r backend/requirements.txt
    # The line to read first in the log. `srp.begin` is ~1,400x every other operation and the two
    # SRP backends differ by ~2x, so the backend decides what the rest of the output means. It is
    # picked by whether libssl can be dlopen'd — not by us — so a base-image bump can change it
    # silently. `python:3.12-slim` ships libssl.so.3 while the package asks for libssl.so.1.1,
    # which is why we expect the pure-Python fallback here; this job is how we find out when that
    # stops being true.
    - python -c "import srp; print('SRP backend:', srp._mod.__name__)"
    - |
      D=$(mktemp -d)
      RACK_WEB_SECRET_KEY=ci-benchmark-not-a-credential \
      NVIS_IDENTITY_FILE=$D/identity.json \
      RACK_WEB_SIGNING_KEY_DIR=$D/oidc \
        python bin/bench-auth.py --metrics auth-metrics.txt --json auth-bench.json
      rm -rf "$D"
  artifacts:
    when: always
    expire_in: 1 year
    paths:
      # The durable series. Kept a year because the value is the trend, and it carries the
      # environment beside the numbers — a latency history whose hardware is unrecorded cannot be
      # reasoned about later, which is the exact mistake docs/PERFORMANCE_BASELINE.md had to unpick.
      - auth-bench.json
    reports:
      # GitLab diffs these against the target branch and shows the change on the merge request, so
      # a regression is visible where it is introduced rather than in a dashboard nobody opens.
      metrics: auth-metrics.txt

frontend-test:
  stage: test
  image: node:24-slim
  cache:
    key: npm-${CI_COMMIT_REF_SLUG}
    paths:
      - frontend/node_modules/
      - .npm-cache/
  script:
    - cd frontend
    - npm ci --ignore-scripts
    - npx vitest run --reporter=default --reporter=junit --outputFile=../report-frontend.xml --coverage --coverage.reporter=text-summary
  coverage: '/Statements\s*:\s*(\d+\.?\d*%)/'
  artifacts:
    when: always
    reports:
      junit: report-frontend.xml

# ─── Build (Kaniko verify; JFrog push is in ci_toolkit_release) ──────────────

docker-build:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  script:
    - bin/write-build-info.sh --stamp "$(date -u +%Y%m%dT%H%M).${CI_COMMIT_SHORT_SHA}"
    - /kaniko/executor
      --context "${CI_PROJECT_DIR}"
      --dockerfile "${CI_PROJECT_DIR}/Dockerfile"
      --no-push
  rules:
    # The release image build (docker-save) + JFrog push cover the release commit
    # on main, so skip the redundant verify-only build there.
    - if: $CI_COMMIT_BRANCH == "main"
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  allow_failure: true

# ─── Air-gapped image bundle (docker save → downloadable .tar artifact) ─────────
# Produces a self-contained image tarball that can be downloaded from the pipeline,
# copied to an offline/air-gapped host, then `docker load`ed and `docker run`. The
# k8s runners have no Docker daemon, so we use Kaniko's --tarPath (the daemonless
# equivalent of `docker save`) instead of build-docker.sh's local `docker save`.
#
# Builds automatically on the release (finalize) commit — tagged with the release
# VERSION from version.py — so the bundle ships with every release. Also available
# on-demand (manual) on any other pipeline for ad-hoc offline images.
docker-save:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  variables:
    IMAGE_NAME: "nvis-rack-status"
  script:
    # On the release commit version.py holds the new release version; elsewhere
    # (manual runs) fall back to the short SHA so the artifact is still unique.
    - export VERSION=$(grep -Eo '"[0-9]+\.[0-9]+\.[0-9]+[^"]*"' version.py 2>/dev/null | head -1 | tr -d '"')
    - export BUNDLE_TAG="${VERSION:-$CI_COMMIT_SHORT_SHA}"
    - export IMAGE_TAR="${IMAGE_NAME}-${BUNDLE_TAG}.tar"
    # Stamped into var/build-info.json, which is what the dashboard reports as its build. Two
    # images from the same release commit are otherwise indistinguishable to an operator.
    - export BUILD_STAMP="$(date -u +%Y%m%dT%H%M).${CI_COMMIT_SHORT_SHA}"
    - bin/write-build-info.sh --stamp "${BUILD_STAMP}"
    - echo "Building air-gapped bundle ${IMAGE_TAR} (tag ${BUNDLE_TAG}, build ${BUILD_STAMP})"
    - /kaniko/executor
      --context "${CI_PROJECT_DIR}"
      --dockerfile "${CI_PROJECT_DIR}/Dockerfile"
      --no-push
      --destination "${IMAGE_NAME}:${BUNDLE_TAG}"
      --destination "${IMAGE_NAME}:latest"
      --tarPath "${CI_PROJECT_DIR}/${IMAGE_TAR}"
    - gzip -f "${IMAGE_TAR}"
    - sha256sum "${IMAGE_TAR}.gz" > "${IMAGE_TAR}.gz.sha256"
    - ls -lh "${IMAGE_TAR}.gz"
    # Pass the resolved tag + filename to the publish job via dotenv.
    - printf 'BUNDLE_TAG=%s\nBUNDLE_FILE=%s\n' "${BUNDLE_TAG}" "${IMAGE_TAR}.gz" > bundle.env
    - cat bundle.env
  artifacts:
    name: "nvis-rack-status-image-${CI_COMMIT_SHORT_SHA}"
    paths:
      - "nvis-rack-status-*.tar.gz"
      - "nvis-rack-status-*.tar.gz.sha256"
    reports:
      dotenv: bundle.env
    expire_in: 2 weeks
  rules:
    - !reference [.rules:on_main_finalize_commit, rules]
    - when: manual
      allow_failure: true

# ─── Publish the bundle to the Package Registry + attach to the GitLab Release ──
# Runs on the release (finalize) commit, alongside the ci-toolkit release jobs.
# Uploads the versioned tarball to the project's generic Package Registry (a stable,
# permanent, version-addressed URL) and links it as an asset on the GitLab Release
# so the air-gapped image is downloadable straight from the release page.
release:publish-bundle:
  stage: ci_toolkit_release
  image:
    name: dockerhub.nvidia.com/python:3.12
    pull_policy: ["if-not-present", "always"]
  tags:
    - $GITLAB_RUNNER_DOCKER_TAG
  variables:
    GIT_STRATEGY: none
  needs:
    - job: docker-save
      artifacts: true
    - job: "release:finalize"
      artifacts: false
      optional: true
  rules:
    - !reference [.rules:on_main_finalize_commit, rules]
  script:
    # Single literal block: keeps the `JOB-TOKEN: ...` header colon out of YAML's
    # block-sequence parser (a bare `- curl ... "X: y"` item is read as a mapping).
    - |
      set -e
      test -n "${BUNDLE_TAG:-}" && test -f "${BUNDLE_FILE:-}"
      PKG_BASE="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/nvis-rack-status-image/${BUNDLE_TAG}"
      echo "Uploading ${BUNDLE_FILE} -> ${PKG_BASE}/"
      curl --fail-with-body --silent --show-error --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file "${BUNDLE_FILE}" "${PKG_BASE}/${BUNDLE_FILE}"
      curl --fail-with-body --silent --show-error --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file "${BUNDLE_FILE}.sha256" "${PKG_BASE}/${BUNDLE_FILE}.sha256"
      echo "Attaching release asset link to release ${BUNDLE_TAG} (best-effort)"
      curl --fail-with-body --silent --show-error --request POST \
        --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        --data-urlencode "name=${BUNDLE_FILE} (air-gapped Docker image)" \
        --data-urlencode "url=${PKG_BASE}/${BUNDLE_FILE}" \
        --data "link_type=package" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases/${BUNDLE_TAG}/assets/links" \
        || echo "WARN: could not attach release link (release ${BUNDLE_TAG} may not exist yet or token scope); bundle is in the Package Registry regardless."
  after_script:
    - !reference [.pipeline_post_job_hooks, after_script]

