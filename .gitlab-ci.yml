include:
  - project: 'ci-toolkit/ci-toolkit'
    ref: 'stable'
    file:
      - .reusable_jobs/release/mono/release.yml
      - .reusable_jobs/auto_merge/auto_merge_automated_release.yml
      - .reusable_jobs/docker/multi/buildkit/docker_build_and_push_rc.yml
      - .reusable_jobs/docker/multi/buildkit/docker_build_and_push.yml


default:
  retry:
    max: 2
    when:
      - script_failure
      - runner_system_failure
      - stuck_or_timeout_failure
      - scheduler_failure
      - api_failure
      - data_integrity_failure
      - unknown_failure


stages:
  - ci_toolkit_release

variables:
  LOG_LEVEL: "INFO"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  GITLAB_RUNNER_DOCKER_TAG: "fusion-instance-k8s"

  ############# AUTOMATED BADGES ###########################################
  CI_TOOLKIT_AUTOMATED_BADGES: "['apps_release_badges.json']"
  ##########################################################################
  CI_TOOLKIT_MR_COMMENTER_BOT: "CI_TOOLKIT_VERSION_BOT"
  ##########################################################################

  ############# AUTOMATED DOCKER BUILD AND PUSH TO JFROG ################
  PUSH_TO_JFROG: "true"
  JFROG_IMAGE_PREFIX: "artifactory.nvidia.com/it-astra-docker-local"
  JFROG_DOCKER_REGISTRY_HOSTNAME: "artifactory.nvidia.com"
  ##########################################################################
