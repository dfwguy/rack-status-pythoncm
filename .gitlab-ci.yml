stages:
  - lint
  - test
  - build

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm-cache"

# Run all jobs on branch pushes and merge requests
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# ─── Lint ────────────────────────────────────────────────────────────────────

python-lint:
  stage: lint
  image: python:3.12-slim
  cache:
    key: pip-${CI_COMMIT_REF_SLUG}
    paths:
      - .pip-cache/
  script:
    - pip install -q ruff
    - ruff check app.py native_status.py demo_data.py host_exec.py platforms/
  allow_failure: true

typescript-check:
  stage: lint
  image: node:22-slim
  cache:
    key: npm-${CI_COMMIT_REF_SLUG}
    paths:
      - frontend/node_modules/
      - .npm-cache/
  script:
    - cd frontend
    - npm ci --ignore-scripts
    - npx tsc -b --noEmit

# ─── Test ────────────────────────────────────────────────────────────────────

python-test:
  stage: test
  image: python:3.12-slim
  cache:
    key: pip-${CI_COMMIT_REF_SLUG}
    paths:
      - .pip-cache/
  script:
    - pip install -q flask openpyxl pytest requests pyyaml pytest-cov
    - python -m pytest tests/ -v --tb=short --junitxml=report-python.xml --cov=ai_chat --cov=workflow_engine --cov-report=term-missing
  coverage: '/TOTAL.+\s(\d+%)/'
  artifacts:
    when: always
    reports:
      junit: report-python.xml

frontend-test:
  stage: test
  image: node:22-slim
  cache:
    key: npm-${CI_COMMIT_REF_SLUG}
    paths:
      - frontend/node_modules/
      - .npm-cache/
  script:
    - cd frontend
    - npm ci --ignore-scripts
    - npx vitest run --reporter=default --reporter=junit --outputFile=../report-frontend.xml --coverage --coverage.reporter=text-summary
  coverage: '/Statements\s*:\s*(\d+\.?\d*%)/'
  artifacts:
    when: always
    reports:
      junit: report-frontend.xml

# ─── Build ───────────────────────────────────────────────────────────────────

docker-build:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  script:
    - /kaniko/executor
      --context "${CI_PROJECT_DIR}"
      --dockerfile "${CI_PROJECT_DIR}/Dockerfile"
      --no-push
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  allow_failure: true

