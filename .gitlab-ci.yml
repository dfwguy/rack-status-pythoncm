include:
  - project: 'ci-toolkit/ci-toolkit'
    ref: 'stable'
    file:
      - .reusable_jobs/release/mono/release.yml
      - .reusable_jobs/auto_merge/auto_merge_automated_release.yml
      - .reusable_jobs/docker/multi/buildkit/docker_build_and_push_rc.yml
      - .reusable_jobs/docker/multi/buildkit/docker_build_and_push.yml
      - .reusable_jobs/docker/astra_deploy_repo_updater.yml

default:
  retry:
    max: 2
    when:
      - script_failure
      - runner_system_failure
      - stuck_or_timeout_failure
      - scheduler_failure
      - api_failure
      - data_integrity_failure
      - unknown_failure

# App CI (lint / test / image verify) runs first; ci-toolkit release + JFrog push last.
stages:
  - lint
  - test
  - build
  - ci_toolkit_release

variables:
  DEPLOY_REPO_URL: "https://gitlab-master.nvidia.com/ape-repo/astra-projects/nvis-rack-status-owners/nvis-rack-status-demo-deploy.git"
  # No Slack pipeline-failure notifications (ci-toolkit after_script skips when false + no token).
  CI_TOOLKIT_SLACK_VIA_API: "false"
  LOG_LEVEL: "INFO"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm-cache"
  GITLAB_RUNNER_DOCKER_TAG: "fusion-instance-k8s"

  ############# AUTOMATED BADGES ###########################################
  CI_TOOLKIT_AUTOMATED_BADGES: "['apps_release_badges.json']"
  ##########################################################################
  CI_TOOLKIT_MR_COMMENTER_BOT: "CI_TOOLKIT_VERSION_BOT"
  ##########################################################################

  ############# AUTOMATED DOCKER BUILD AND PUSH TO JFROG ################
  PUSH_TO_JFROG: "true"
  JFROG_IMAGE_PREFIX: "artifactory.nvidia.com/it-astra-docker-local"
  JFROG_DOCKER_REGISTRY_HOSTNAME: "artifactory.nvidia.com"
  ##########################################################################

# Run lint/test/build on branch pushes and merge requests
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# ─── Lint ────────────────────────────────────────────────────────────────────

python-lint:
  stage: lint
  image: python:3.12-slim
  cache:
    key: pip-${CI_COMMIT_REF_SLUG}
    paths:
      - .pip-cache/
  script:
    - pip install -q ruff
    - ruff check app.py native_status.py demo_data.py host_exec.py platforms/ rack_locks.py token_vault.py nvftp_cache_sync.py
    - bash scripts/check_no_vault_in_git.sh
  allow_failure: true

typescript-check:
  stage: lint
  image: node:22-slim
  cache:
    key: npm-${CI_COMMIT_REF_SLUG}
    paths:
      - frontend/node_modules/
      - .npm-cache/
  script:
    - cd frontend
    - npm ci --ignore-scripts
    - npx tsc -b --noEmit

# ─── Test ────────────────────────────────────────────────────────────────────

python-test:
  stage: test
  image: python:3.12-slim
  cache:
    key: pip-${CI_COMMIT_REF_SLUG}
    paths:
      - .pip-cache/
  script:
    - pip install -q -r requirements.txt pytest pytest-cov
    - python -m pytest tests/ -v --tb=short --junitxml=report-python.xml --cov=ai_chat --cov=workflow_engine --cov-report=term-missing
  coverage: '/TOTAL.+\s(\d+%)/'
  artifacts:
    when: always
    reports:
      junit: report-python.xml

frontend-test:
  stage: test
  image: node:22-slim
  cache:
    key: npm-${CI_COMMIT_REF_SLUG}
    paths:
      - frontend/node_modules/
      - .npm-cache/
  script:
    - cd frontend
    - npm ci --ignore-scripts
    - npx vitest run --reporter=default --reporter=junit --outputFile=../report-frontend.xml --coverage --coverage.reporter=text-summary
  coverage: '/Statements\s*:\s*(\d+\.?\d*%)/'
  artifacts:
    when: always
    reports:
      junit: report-frontend.xml

# ─── Build (Kaniko verify; JFrog push is in ci_toolkit_release) ──────────────

docker-build:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  script:
    - /kaniko/executor
      --context "${CI_PROJECT_DIR}"
      --dockerfile "${CI_PROJECT_DIR}/Dockerfile"
      --no-push
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  allow_failure: true

