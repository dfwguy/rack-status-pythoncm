# HOW THIS DEPLOYMENT RESOLVES FILES — two layers, and the mount always wins.
#
#   1. The image. `docker build` COPYs the tree in, so an unmounted path runs the code as it was at
#      build time. Changing it needs a rebuild.
#   2. Bind mounts. A mounted path shadows the image's copy entirely, and the host's file is what
#      runs. This is deliberate: it is what lets a live deployment be updated without a rebuild
#      (see bin/deploy-app.sh), which on a customer cluster is the difference between a one-minute
#      fix and a full build.
#
# Three consequences follow, and each has already cost us an outage or a wrong answer:
#
#   * A file generated DURING the build, under a mounted path, is invisible at runtime — the mount
#     covers it. That is why bin/write-build-info.sh stamps backend/build-info.json into the TREE
#     and lets COPY carry it into the image, rather than the Dockerfile generating it.
#   * /app/var is a named volume (rack-data), which is stricter still: Docker seeds a named volume
#     from the image only while the volume is EMPTY. On any deployment that has run once, a file
#     written to var/ at build time can never be read.
#   * A NEW module under a per-file mount list is invisible until it is listed. The Nscale TX
#     override bind-mounts backend files individually, so adding a module or a package without
#     updating that list boots the new app.py against missing imports. Prefer mounting the
#     directory (`./backend:/app/backend:ro`) so new files are picked up automatically.
#
# The rule of thumb: whatever path is mounted, the TREE is the source of truth for it, and an image
# rebuild alone will not change its behaviour.
services:
  rack-status:
    # Build identity comes from backend/build-info.json, which bin/write-build-info.sh writes into
    # the tree; COPY backend/ carries it into the image. Not a build arg, because a deployment that
    # bind-mounts backend/ over the image's would hide anything generated during the build:
    #   bin/write-build-info.sh && docker compose build && docker compose up -d
    build: .
    network_mode: host
    env_file: rack-config.env
    environment:
      - RACK_SSH_HOST=${RACK_SSH_HOST}
      # File-backed auth is preferred: unlike an environment secret, its value
      # is not exposed by `docker inspect`.  The legacy value remains accepted
      # during migration; unset it after provisioning RACK_WEB_AUTH_TOKEN_PATH.
      - RACK_WEB_AUTH_TOKEN_FILE=/run/secrets/rack-web-auth-token
      - RACK_WEB_AUTH_TOKEN=${RACK_WEB_AUTH_TOKEN:-}
      - RACK_LAKE_URL=http://127.0.0.1:9410
      - RACK_LAKE_CLUSTER=NscaleTX-16K
      - RACK_PUNCHCARD_TOKEN_FILE=/run/secrets/gsheets-token
      - RACK_PUNCHCARD_SPREADSHEET_ID=1NSs3c7v6r5mf5h-GKNZHNekVU9XsAAgJp3KyeeJK-PA
      - RACK_PUNCHCARD_RANGE=Sheet2!A1:Z1000
    # Slurm propagates the submitting process's memlock ceiling. UCX registration
    # for NeMo's four-rail IB transport requires unlimited locked memory; Docker's
    # default 8 MiB limit caused an ibv_reg_mr error storm before training began.
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - ${RACK_SSH_KEY_PATH:-~/.ssh/id_ecdsa}:/run/secrets/ssh_key:ro
      - ${RACK_KNOWN_HOSTS_PATH:-~/.ssh/known_hosts}:/run/secrets/known_hosts:ro
      - ${RACK_BCM_CREDENTIALS_PATH:-~/.cm}:/root/.cm:ro
      - ${RACK_PUNCHCARD_TOKEN_PATH:-/home/hlakshminara/.gsheets-token}:/run/secrets/gsheets-token:ro
      - /cm:/cm:ro
      - /run/munge:/run/munge:ro
      - /run/nvis-pythoncm:/run/nvis-pythoncm:ro
      - /cluster/bringup:/cluster/bringup:ro
      - /cluster/OVA/containers/nvftp-8k-known-good/20260824:/cluster/OVA/containers/nvftp-8k-known-good/20260824:ro
      - /cluster/OVA/scripts/nscaletx-16k-validation:/cluster/OVA/scripts/nscaletx-16k-validation:ro
      - /cluster/OVA/logs:/cluster/OVA/logs:rw
      - /cluster/OVA/healthchecks/logs:/cluster/OVA/healthchecks/logs:ro
      - ./backend:/app/backend:ro
      - ./bin:/app/bin:ro
      - rack-data:/app/var
    secrets:
      - rack-web-auth-token
    restart: unless-stopped

volumes:
  rack-data:

secrets:
  rack-web-auth-token:
    # The empty placeholder keeps legacy env-token deployments compatible.
    # Production deployments must set this to a mode-0400/0600 regular file.
    file: ${RACK_WEB_AUTH_TOKEN_PATH:-./deploy/placeholders/empty-web-auth-token}
