# HOW THIS DEPLOYMENT RESOLVES FILES — two layers, and the mount always wins.
#
#   1. The image. `docker build` COPYs the tree in, so an unmounted path runs the code as it was at
#      build time. Changing it needs a rebuild.
#   2. Bind mounts. A mounted path shadows the image's copy entirely, and the host's file is what
#      runs. This is deliberate: it is what lets a live deployment be updated without a rebuild
#      (see bin/deploy-app.sh), which on a customer cluster is the difference between a one-minute
#      fix and a full build.
#
# Three consequences follow, and each has already cost us an outage or a wrong answer:
#
#   * A file generated DURING the build, under a mounted path, is invisible at runtime — the mount
#     covers it. That is why bin/write-build-info.sh stamps backend/build-info.json into the TREE
#     and lets COPY carry it into the image, rather than the Dockerfile generating it.
#   * /app/var is a named volume (rack-data), which is stricter still: Docker seeds a named volume
#     from the image only while the volume is EMPTY. On any deployment that has run once, a file
#     written to var/ at build time can never be read.
#   * A NEW module under a per-file mount list is invisible until it is listed. The Nscale TX
#     override bind-mounts backend files individually, so adding a module or a package without
#     updating that list boots the new app.py against missing imports. Prefer mounting the
#     directory (`./backend:/app/backend:ro`) so new files are picked up automatically.
#
# The rule of thumb: whatever path is mounted, the TREE is the source of truth for it, and an image
# rebuild alone will not change its behaviour.
services:
  rack-status:
    # Build identity comes from backend/build-info.json, which bin/write-build-info.sh writes into
    # the tree; COPY backend/ carries it into the image. Not a build arg, because a deployment that
    # bind-mounts backend/ over the image's would hide anything generated during the build:
    #   bin/write-build-info.sh && docker compose build && docker compose up -d
    build: .
    # Published on LOOPBACK by default. Without a bind address Docker publishes on 0.0.0.0, which
    # on the Nscale TX OVA made :5056 answer plaintext HTTP to anything routable on that segment --
    # so during the window /ws/terminal was unauthenticated, the reachable population was everyone
    # on the management network rather than everyone holding SSH access. Every documented access
    # path here is an ssh tunnel, which terminates on the host and reaches loopback fine, so this
    # costs nothing. Set RACK_WEB_BIND_ADDR=0.0.0.0 in .env to expose it deliberately. The listener
    # is HTTPS-only either way.
    ports:
      - "${RACK_WEB_BIND_ADDR:-127.0.0.1}:${RACK_WEB_PORT:-5000}:5000"
    volumes:
      # Operator configuration, one directory, read-only: rackstatus.toml (create it with
      # `python3 backend/cli.py init-config --ssh-host <head>`) and, optionally, tls/server.crt +
      # tls/server.key. Without a supplied certificate a self-signed one is generated on first
      # start and kept on rack-data, so it survives a recreate.
      - ./config:/app/config:ro
      - ${RACK_SSH_KEY_PATH:-~/.ssh/id_rsa}:/run/secrets/ssh_key:ro
      - rack-data:/app/var
    restart: unless-stopped

volumes:
  # Compose names this `<project>_rack-data` (the project defaults to the directory name). Do NOT
  # add `name:` to shorten it: every existing deployment would come up on a new, empty volume and
  # lose its identity store, certificate and history. Address it by label instead, e.g.
  #   docker volume ls -q --filter label=com.docker.compose.volume=rack-data
  rack-data:
