RACK_MULTIRACK_CAMPAIGN_ID = "Identifier of the pinned acceptance campaign, so a stale browser cannot launch against last week's roster."
RACK_MULTIRACK_CAMPAIGN_MANIFEST = "Path to the campaign manifest listing the exact nodes."
RACK_MULTIRACK_CAMPAIGN_NODES_PER_RACK = "Nodes each rack is expected to contribute to a campaign. Default 16."
RACK_MULTIRACK_LEDGER_FILE = "The multirack results ledger."
RACK_MULTIRACK_LEDGER_MARKDOWN_FILE = "Markdown rendering of that ledger."
RACK_MULTIRACK_LEDGER_EXPORT_STATUS_FILE = "Where the ledger export records its own progress."
RACK_MULTIRACK_LEDGER_LAKE_DISABLED = "Stop publishing ledger rows to the data lake."
RACK_VALIDATION_EXCLUDED_NODES = "Comma-list of nodes never eligible for a validation launch, whatever the selection."

