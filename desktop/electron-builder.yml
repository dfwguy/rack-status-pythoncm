appId: com.nvidia.nvis.greenlight
productName: NVIS Greenlight
copyright: Copyright (c) 2026 NVIDIA CORPORATION & AFFILIATES

directories:
  output: release
  buildResources: resources

# Only the compiled output and production dependencies. `src/` and the dev toolchain are not
# shipped: the TypeScript is not needed at runtime and would just enlarge every installer.
files:
  - out/**/*
  - package.json

# The 1024px three-bar mark, generated by bin/gen-pwa-icons.py. electron-builder derives .icns,
# .ico and the Linux hicolor set from this one file.
icon: resources/icon.png

mac:
  category: public.app-category.developer-tools
  # Space-free artifact names, and this is a hard requirement rather than tidiness.
  #
  # The default is `${productName}-...`, and productName is "NVIS Greenlight" — so the default
  # names contain spaces. Two things break on that:
  #
  #   * **3S refuses the upload outright**: `HTTP 400: Filename cannot contain spaces`. Signing is
  #     not optional, so neither is this.
  #   * `latest-mac.yml` records each file by name and `electron-updater` resolves it against the
  #     feed URL, so a space becomes a `%20` that a generic HTTP host may or may not serve back.
  #
  # `nvis-greenlight` rather than `${name}` to avoid the redundant "-desktop" in a filename that
  # already says what it is.
  artifactName: nvis-greenlight-${version}-${arch}.${ext}
  target:
    - target: dmg
      arch: [arm64, x64]
    # zip alongside dmg is not redundant: electron-updater's macOS path reads the zip, so a
    # dmg-only build produces installers that can never update themselves.
    - target: zip
      arch: [arm64, x64]
  # Gatekeeper refuses an unsigned app outright since Sequoia -- the right-click-to-open bypass is
  # gone. So a distributable build needs a Developer ID plus notarization; CSC_* and APPLE_* in the
  # environment turn it on. Left unset for local `--dir` builds, which run fine ad-hoc signed.
  hardenedRuntime: true
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist

win:
  target:
    - target: nsis
      arch: [x64, arm64]

nsis:
  # Same reason as the mac block: the default is "NVIS Greenlight Setup 0.3.0.exe". Windows
  # Authenticode signing goes through 3S too, and 3S rejects spaces.
  artifactName: nvis-greenlight-setup-${version}-${arch}.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

linux:
  category: Development
  # Space-free, for the third time in this file — and here it was actually load-bearing rather
  # than precautionary. Left at the default `${productName}-${version}.${ext}`, the build produced
  # `NVIS Greenlight-0.3.0-260910185147.AppImage` on disk while latest-linux.yml recorded the
  # payload as `Greenlight-0.3.0-260910185147.AppImage` — electron-builder does not agree with
  # itself about what the space means. The updater resolves that name against the feed URL, so
  # every Linux client would have fetched a 404 and reported "up to date" forever, with the real
  # update sitting one filename away. Nothing about the build looked wrong; publish-release.sh
  # caught it only because it cross-checks each manifest entry against a real file.
  artifactName: nvis-greenlight-${version}-${arch}.${ext}
  # `fpm` refuses to build a .deb or .rpm without a maintainer, and the AppImage does not need one
  # — so a Linux build appears to work and then fails halfway, with the AppImage already produced.
  maintainer: Rafael M. Koike <rkoike@nvidia.com>
  synopsis: Observability, validation and automation console for NVIDIA AI factory clusters
  # Electron uses this as the app_id / WM_CLASS. Without it a running window is not associated with
  # its launcher entry, so the dock shows a generic icon beside the real one — cosmetic, but it is
  # the sort of thing that reads as "this app is not properly packaged".
  syncDesktopName: true
  # AppImage first, and the order is meaningful: it is the ONLY Linux target electron-updater can
  # update in place. deb and rpm are owned by the system package manager, so `updater.ts` detects
  # them (no $APPIMAGE) and tells the operator to update through apt/dnf instead of spinning.
  target:
    - AppImage
    - deb
    - rpm

# Update feed. `generic` rather than a GitLab provider because the artifacts live in the GitLab
# *generic* Package Registry, the same place `docker-save` publishes the air-gapped image bundle.
# Payloads are verified against a signature before install regardless of transport.
#
# **This URL is baked into every build and must therefore be constant across releases.** Two ways
# to get that wrong, both of which this config did:
#
#   * `${env.CI_PROJECT_ID}` — only defined inside a CI job, so `npm run dist` on a workstation
#     died with `env CI_PROJECT_ID is not defined` before building anything. electron-builder
#     expands `publish` even when it is not publishing, so `--publish never` does not avoid it.
#     GitLab's API takes the URL-encoded project path just as happily, and that is a constant.
#   * `${version}` — expands at *build* time, so the 0.3.0 build asked
#     `…/nvis-greenlight-desktop/0.3.0/latest-mac.yml` for news of a newer release. That folder
#     only ever contains 0.3.0, so the app would have reported "you are on the latest version"
#     forever while 0.4.0 sat one directory away. Silent, and invisible in testing, because a
#     single-version registry answers exactly like an up-to-date one.
#
# Hence a fixed `latest` path segment. GitLab validates `package_version` against
# `\A(\.?[\w\+-]+\.?)+\z`, which `latest` satisfies. Two consequences for the release job:
# the artifacts must be uploaded *beside* the manifest (`latest-*.yml` names its files
# relative to this URL), and the registry's "Reject duplicates" setting must allow overwriting
# this one version — or every release after the first is refused.
#
# `channel: latest` below is unrelated to that path segment: it names which manifest file to
# read (`latest-mac.yml`, `latest.yml`, `latest-linux.yml`).
publish:
  - provider: generic
    url: https://gitlab-master.nvidia.com/api/v4/projects/nvis%2Fnvis-rack-status/packages/generic/nvis-greenlight-desktop/latest
    channel: latest
